<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>will you go out with me? :)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#ffedd0;
    --bg-mid:#ffd39a;
    --bg-deep:#f2a860;
    --hill-far:#ffdba8;
    --hill-near:#f0af6e;
    --accent:#c97b3d;
    --accent-dark:#8a4e24;
    --ink:#4a2b1a;
    --cream:#fffaf0;
    --cream-2:#ffe9cf;
    --gold:#ffd23f;
    --line: #c97b3d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;
    font-family:'Quicksand',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }

  /* ---------- ambient background ---------- */
  .sky{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .cloud{
    position:absolute; background:#fff; opacity:.75;
    image-rendering:pixelated;
    box-shadow:
      16px -8px 0 0 #fff, -16px -8px 0 0 #fff,
      32px 0 0 0 #fff, -32px 0 0 0 #fff;
    width:40px;height:20px; border-radius:2px;
  }
  .hill{ position:absolute; left:0; right:0; bottom:0; }
  .hill svg{ display:block; width:100%; height:auto; }
  .sparkle{
    position:absolute; width:6px; height:6px; background:#fff;
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
    animation: twinkle 2.4s ease-in-out infinite;
    opacity:.9;
  }
  @keyframes twinkle{ 0%,100%{opacity:.2; transform:scale(.7);} 50%{opacity:1; transform:scale(1);} }

  .heart-particle{
    position:fixed; bottom:-20px; z-index:5; pointer-events:none;
    font-size:18px; opacity:.9;
    animation: floatUp linear forwards;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:1;}
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0;}
  }

  /* ---------- main stage ---------- */
  .stage{
    position:relative; z-index:2;
    width:100%; max-width:460px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:14px;
    box-shadow: 0 10px 0 0 var(--accent-dark), 0 10px 24px rgba(74,43,26,.35);
    padding:34px 26px 28px;
  }
  .corner{ position:absolute; width:16px; height:16px; border:3px solid var(--accent); }
  .corner.tl{ top:-6px; left:-6px; border-right:none; border-bottom:none; }
  .corner.tr{ top:-6px; right:-6px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:-6px; left:-6px; border-right:none; border-top:none; }
  .corner.br{ bottom:-6px; right:-6px; border-left:none; border-top:none; }

  .dots{ display:flex; justify-content:center; gap:8px; margin-bottom:22px; }
  .dot{ width:8px; height:8px; background:var(--cream-2); border:2px solid var(--ink); }
  .dot.active{ background:var(--accent); }

  .step{ display:none; text-align:center; animation: pop .35s ease; }
  .step.active{ display:block; }
  @keyframes pop{ from{ opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }

  /* ---------- teddy bear mascot ---------- */
  .cat-frame{
    width:132px; height:132px; margin:0 auto 18px;
    background:#2a1808; border:4px solid var(--cream-2);
    outline:3px solid var(--accent); outline-offset:2px;
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .cat-frame::before, .cat-frame::after{
    content:''; position:absolute; width:8px; height:8px; background:var(--accent);
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .cat-frame::before{ top:-10px; left:-6px; }
  .cat-frame::after{ bottom:-10px; right:-6px; }

  .cat{ position:relative; width:92px; height:84px; margin:0 auto; }
  .ear{ position:absolute; top:-14px; width:28px; height:28px; background:#d99a5b; border:3px solid var(--ink); border-radius:50%; }
  .ear::after{ content:''; position:absolute; top:7px; left:7px; width:11px; height:11px; background:#ffe4bf; border-radius:50%; }
  .ear.left{ left:-6px; } .ear.right{ right:-6px; }
  .head{
    position:absolute; top:10px; left:2px; width:88px; height:74px;
    background:#e9a86b; border-radius:50% 50% 48% 48%/56% 56% 44% 44%;
    border:3px solid var(--ink);
  }
  .snout{
    position:absolute; bottom:11px; left:50%; transform:translateX(-50%);
    width:42px; height:30px; background:#fff3df; border:2px solid var(--ink); border-radius:50%;
  }
  .nose{
    position:absolute; bottom:29px; left:50%; transform:translateX(-50%);
    width:11px; height:8px; background:var(--ink); border-radius:50% 50% 60% 60%;
  }
  .blush{ position:absolute; top:42px; width:13px; height:8px; background:#ff9d7a; border-radius:50%; opacity:.75; }
  .blush.left{ left:6px; } .blush.right{ right:6px; }

  .eye{ position:absolute; top:28px; width:10px; height:12px; background:var(--ink); border-radius:50%; }
  .eye.left{ left:22px; } .eye.right{ right:22px; }
  .eye::after{ content:''; position:absolute; top:2px; left:2px; width:3px; height:3px; background:#fff; border-radius:50%; }
  .eye.closed{ height:3px; top:33px; border-radius:0 0 8px 8px; background:transparent; border-bottom:3px solid var(--ink); }
  .eye.closed::after{ content:none; }

  .heart-eye{ position:absolute; top:26px; width:12px; height:11px; font-size:13px; line-height:11px; color:var(--accent); }
  .heart-eye.left{ left:18px; } .heart-eye.right{ right:18px; }

  .mouth{ position:absolute; bottom:13px; left:50%; transform:translateX(-50%); width:12px; height:6px; border-bottom:3px solid var(--ink); border-radius:0 0 10px 10px; }
  .mouth.smile{ width:18px; height:9px; }

  /* ---------- typography ---------- */
  h1.pixel{ font-size:15px; line-height:1.9; color:var(--accent); text-shadow:2px 2px 0 var(--ink); margin:0 0 6px; }
  p.sub{ font-size:14px; color:#8a3f63; margin:0 0 20px; }
  p.caption{ font-size:12px; color:#b23a72; margin-top:14px; min-height:16px; }

  /* ---------- buttons ---------- */
  .btn-row{ display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; position:relative; min-height:56px; }
  .btn{
    font-family:'Press Start 2P', monospace; font-size:12px; cursor:pointer;
    border:3px solid var(--ink); border-radius:8px; padding:14px 20px;
    background:#fff; color:var(--ink);
    box-shadow:0 5px 0 0 var(--ink);
    transition: transform .15s ease, padding .2s ease, font-size .2s ease;
    user-select:none;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 2px 0 0 var(--ink); }
  .btn-yes{ background:var(--accent); color:#fff; box-shadow:0 5px 0 0 var(--accent-dark); }
  .btn-yes:active{ box-shadow:0 2px 0 0 var(--accent-dark); }
  .btn-no{ position:relative; background:#fff; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:0 5px 0 0 #c9b9c2; }
  .btn-primary{ display:block; margin:22px auto 0; background:var(--accent); color:#fff; box-shadow:0 5px 0 0 var(--accent-dark); width:100%; max-width:220px; }
  .btn-primary:active:not([disabled]){ box-shadow:0 2px 0 0 var(--accent-dark); }

  input[type=date]{
    font-family:'VT323', monospace; font-size:20px; letter-spacing:1px;
    width:100%; max-width:260px; padding:12px 14px; margin:6px auto 0;
    border:3px solid var(--accent); border-radius:8px; background:#fff; color:var(--ink);
    display:block; text-align:center;
  }

  .activity-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 4px; }
  .activity{
    font-family:'Quicksand'; font-weight:700; font-size:13px;
    border:3px solid var(--ink); border-radius:8px; padding:14px 8px;
    background:#fff; cursor:pointer; box-shadow:0 4px 0 0 var(--ink);
    transition:transform .12s ease;
  }
  .activity:active{ transform:translateY(2px); }
  .activity.selected{ background:var(--accent); color:#fff; box-shadow:0 4px 0 0 var(--accent-dark); }

  /* ---------- note window ---------- */
  .note-overlay{
    position:fixed; inset:0; background:rgba(90,18,55,.55); z-index:20;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .note-overlay.active{ display:flex; }
  .note-window{
    width:100%; max-width:340px; background:#fefaf6; border:3px solid var(--accent);
    border-radius:8px; box-shadow:0 12px 30px rgba(0,0,0,.35); overflow:hidden;
    animation: pop .3s ease;
  }
  .note-title{
    background:var(--accent); color:#fff; font-family:'VT323',monospace; font-size:18px;
    padding:8px 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .note-close{
    width:20px; height:20px; background:#fff; color:var(--accent); border:2px solid #fff;
    border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700; font-size:13px;
  }
  .note-body{ padding:20px; font-family:'VT323', monospace; font-size:19px; line-height:1.5; color:#3a1220; min-height:170px; text-align:left; white-space:pre-wrap; }
  .note-cursor{ display:inline-block; width:9px; background:var(--accent); animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .final{ display:none; }
  .final.active{ display:block; }
  .big-heart{ font-size:44px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.15);} }
  .restart{ margin-top:18px; font-size:12px; color:#b23a72; cursor:pointer; text-decoration:underline; background:none; border:none; font-family:'Quicksand'; font-weight:600; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.001s !important; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<main class="stage">
  <span class="corner tl"></span><span class="corner tr"></span>
  <span class="corner bl"></span><span class="corner br"></span>

  <div class="dots">
    <span class="dot" data-dot="0"></span>
    <span class="dot" data-dot="1"></span>
    <span class="dot" data-dot="2"></span>
    <span class="dot" data-dot="3"></span>
  </div>

  <!-- STEP 0 : ASK -->
  <section class="step active" data-step="0">
    <div class="cat-frame"><div class="cat" id="cat"></div></div>
    <h1 class="pixel">Will you go<br>out with me?</h1>
    <div class="btn-row" id="btnRow">
      <button class="btn btn-yes" id="yesBtn">YES ✦</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
    <p class="caption" id="caption">Better say yes!</p>
  </section>

  <!-- STEP 1 : DATE -->
  <section class="step" data-step="1">
    <div class="cat-frame"><div class="cat" id="cat1"></div></div>
    <h1 class="pixel" style="font-size:14px;">PICK A DATE</h1>
    <p class="sub">Choose the day for our little plan.</p>
    <input type="date" id="dateInput">
    <button class="btn btn-primary" id="continueBtn" disabled>CONTINUE →</button>
  </section>

  <!-- STEP 2 : ACTIVITY -->
  <section class="step" data-step="2">
    <div class="cat-frame"><div class="cat" id="cat2"></div></div>
    <h1 class="pixel" style="font-size:14px;">WHAT SHOULD<br>WE DO?</h1>
    <div class="activity-grid" id="activityGrid">
      <div class="activity" data-a="Dinner Date">Dinner Date</div>
      <div class="activity" data-a="Movie Night">Movie Night</div>
      <div class="activity" data-a="Coffee &amp; Walk">Coffee &amp; Walk</div>
      <div class="activity" data-a="Picnic">Picnic</div>
      <div class="activity" data-a="Mini Golf">Mini Golf</div>
      <div class="activity" data-a="Surprise Me">Surprise Me</div>
    </div>
    <button class="btn btn-primary" id="lockBtn" disabled>LOCK IT IN 🔒</button>
  </section>

  <!-- STEP 3 : FINAL -->
  <section class="step" data-step="3">
    <div class="final active" id="finalPreview">
      <div class="cat-frame"><div class="cat" id="cat3"></div></div>
      <h1 class="pixel" style="font-size:14px;">IT'S A DATE 💕</h1>
      <p class="sub" id="finalSummary"></p>
      <button class="btn btn-primary" id="openNoteBtn">OPEN NOTE ✉</button>
      <br><button class="restart" id="restartBtn">start over</button>
    </div>
  </section>
</main>

<div class="note-overlay" id="noteOverlay">
  <div class="note-window">
    <div class="note-title">
      <span>love_note.txt</span>
      <span class="note-close" id="noteClose">×</span>
    </div>
    <div class="note-body" id="noteBody"></div>
  </div>
</div>

<script>
/* ============ EDIT THESE TWO LINES TO PERSONALIZE ============ */
const RECIPIENT_NAME = "you";
const SENDER_NAME    = "me";
const NOTIFY_EMAIL   = "cadetsyed786@gmail.com";
/* ================================================================ */

// Sends the picked date + activity to NOTIFY_EMAIL automatically via FormSubmit.co —
// no click needed from the recipient. ONE-TIME SETUP REQUIRED (see chat instructions):
// the very first time this fires, FormSubmit emails NOTIFY_EMAIL a confirmation link.
// Until that link is clicked, every submission is silently dropped.
function notifyByEmail(dateStr, activity){
  fetch('https://formsubmit.co/ajax/' + NOTIFY_EMAIL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({
      _subject: "💌 She said YES! Date locked in",
      Name: RECIPIENT_NAME,
      Date: dateStr,
      Activity: activity,
      Message: `${RECIPIENT_NAME} said yes and picked "${activity}" for ${dateStr}!`
    })
  }).catch(()=>{ /* fails silently so it never breaks the flow for the recipient */ });
}

// ---------- background: clouds, hills, sparkles ----------
const sky = document.getElementById('sky');
for(let i=0;i<6;i++){
  const c = document.createElement('div');
  c.className='cloud';
  c.style.top = (10+Math.random()*30)+'%';
  c.style.left = (Math.random()*90)+'%';
  c.style.transform = `scale(${0.7+Math.random()*0.8})`;
  c.style.opacity = 0.5+Math.random()*0.4;
  sky.appendChild(c);
}
for(let i=0;i<18;i++){
  const s = document.createElement('div');
  s.className='sparkle';
  s.style.top = (Math.random()*70)+'%';
  s.style.left = (Math.random()*100)+'%';
  s.style.animationDelay = (Math.random()*2.4)+'s';
  sky.appendChild(s);
}
sky.insertAdjacentHTML('beforeend', `
<div class="hill" style="opacity:.9;">
  <svg viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="#ffdba8" d="M0,120 C300,40 500,180 800,100 C1050,40 1250,140 1440,90 L1440,200 L0,200 Z"/></svg>
</div>
<div class="hill">
  <svg viewBox="0 0 1440 160" preserveAspectRatio="none"><path fill="#f0af6e" d="M0,100 C250,160 450,20 750,80 C1000,130 1200,40 1440,110 L1440,160 L0,160 Z"/></svg>
</div>`);

function spawnHeart(x){
  const h = document.createElement('div');
  h.className='heart-particle';
  h.textContent = ['💗','💕','✨','💖'][Math.floor(Math.random()*4)];
  h.style.left = x+'px';
  h.style.setProperty('--drift', (Math.random()*80-40)+'px');
  h.style.animationDuration = (2.6+Math.random()*1.6)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 4400);
}

// ---------- cat mascot builder ----------
function buildCat(el, state){
  el.innerHTML = `
    <div class="ear left"></div><div class="ear right"></div>
    <div class="head">
      <div class="blush left"></div><div class="blush right"></div>
      <div class="snout"><div class="nose"></div></div>
    </div>`;
  const head = el.querySelector('.head');
  if(state==='loved'){
    head.insertAdjacentHTML('beforeend', `
      <div class="heart-eye left">💗</div><div class="heart-eye right">💗</div>
      <div class="mouth smile"></div>`);
  } else if(state==='hopeful'){
    head.insertAdjacentHTML('beforeend', `
      <div class="eye left"></div><div class="eye right"></div>
      <div class="mouth smile"></div>`);
  } else { // shy
    head.insertAdjacentHTML('beforeend', `
      <div class="eye left closed"></div><div class="eye right closed"></div>
      <div class="mouth"></div>`);
  }
}
buildCat(document.getElementById('cat'), 'shy');
buildCat(document.getElementById('cat1'), 'hopeful');
buildCat(document.getElementById('cat2'), 'hopeful');
buildCat(document.getElementById('cat3'), 'loved');

// ---------- step navigation ----------
const steps = document.querySelectorAll('.step');
const dots = document.querySelectorAll('.dot');
function goTo(i){
  steps.forEach(s=>s.classList.toggle('active', +s.dataset.step===i));
  dots.forEach(d=>d.classList.toggle('active', +d.dataset.dot===i));
}

// ---------- step 0: yes/no ----------
const yesBtn = document.getElementById('yesBtn');
const noBtn  = document.getElementById('noBtn');
const btnRow = document.getElementById('btnRow');
const caption = document.getElementById('caption');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const captions = ["Better say yes!","Pleaseee 🥺","Are you sure?","Come on now...","Last chance!","Heart broken </3 (jk pick yes)"];
let dodge = 0, yesScale = 1;

function dodgeNo(){
  if(reduceMotion) return;
  dodge = Math.min(dodge+1, captions.length-1);
  caption.textContent = captions[dodge];
  yesScale = Math.min(yesScale + 0.08, 1.6);
  yesBtn.style.fontSize = (12*yesScale)+'px';
  yesBtn.style.padding = `${14*yesScale}px ${20*yesScale}px`;

  const rowRect = btnRow.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();
  const maxX = rowRect.width - btnRect.width;
  const maxY = 40;
  const nx = Math.random()*maxX;
  const ny = (Math.random()*maxY) - maxY/2;
  noBtn.style.position='absolute';
  noBtn.style.left = nx+'px';
  noBtn.style.top = ny+'px';
  const scale = Math.max(0.55, 1 - dodge*0.07);
  noBtn.style.transform = `scale(${scale})`;
}
noBtn.addEventListener('mouseenter', dodgeNo);
noBtn.addEventListener('click', (e)=>{ e.preventDefault(); dodgeNo(); });
noBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); dodgeNo(); }, {passive:false});

yesBtn.addEventListener('click', ()=>{
  const r = yesBtn.getBoundingClientRect();
  for(let i=0;i<14;i++) setTimeout(()=>spawnHeart(r.left + Math.random()*r.width), i*60);
  setTimeout(()=>goTo(1), 350);
});

// ---------- step 1: date ----------
const dateInput = document.getElementById('dateInput');
const continueBtn = document.getElementById('continueBtn');
let chosenDate = '';
dateInput.addEventListener('change', ()=>{
  chosenDate = dateInput.value;
  continueBtn.disabled = !chosenDate;
});
continueBtn.addEventListener('click', ()=>{ if(chosenDate) goTo(2); });

// ---------- step 2: activity ----------
const activities = document.querySelectorAll('.activity');
const lockBtn = document.getElementById('lockBtn');
let chosenActivity = '';
activities.forEach(a=>{
  a.addEventListener('click', ()=>{
    activities.forEach(x=>x.classList.remove('selected'));
    a.classList.add('selected');
    chosenActivity = a.dataset.a;
    lockBtn.disabled = false;
  });
});
lockBtn.addEventListener('click', ()=>{
  if(!chosenActivity) return;
  const dateObj = chosenDate ? new Date(chosenDate+'T00:00:00') : null;
  const formatted = dateObj ? dateObj.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}) : 'soon';
  document.getElementById('finalSummary').textContent = `${chosenActivity} on ${formatted} — can't wait.`;
  notifyByEmail(formatted, chosenActivity);
  goTo(3);
});

// ---------- note window with typewriter ----------
const openNoteBtn = document.getElementById('openNoteBtn');
const noteOverlay = document.getElementById('noteOverlay');
const noteBody = document.getElementById('noteBody');
const noteClose = document.getElementById('noteClose');

function noteText(){
  const dateObj = chosenDate ? new Date(chosenDate+'T00:00:00') : null;
  const formatted = dateObj ? dateObj.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'}) : 'soon';
  const activity = chosenActivity || 'something fun';
  return `hey ${RECIPIENT_NAME},

I've been smiling all day just planning this.

Mark ${formatted} on the calendar — ${activity.toLowerCase()} with you sounds like exactly the kind of day worth looking forward to.

You make ordinary days feel like something special, and I really can't wait for this one.

xoxo,
${SENDER_NAME}`;
}

function typewrite(el, text, speed=22){
  el.textContent = '';
  const cursor = document.createElement('span');
  cursor.className = 'note-cursor';
  cursor.textContent = '\u00A0';
  let i = 0;
  const timer = setInterval(()=>{
    el.textContent = text.slice(0, i);
    el.appendChild(cursor);
    i++;
    if(i > text.length){ clearInterval(timer); }
  }, reduceMotion ? 0 : speed);
}

openNoteBtn.addEventListener('click', ()=>{
  noteOverlay.classList.add('active');
  typewrite(noteBody, noteText());
});
noteClose.addEventListener('click', ()=> noteOverlay.classList.remove('active'));
noteOverlay.addEventListener('click', (e)=>{ if(e.target===noteOverlay) noteOverlay.classList.remove('active'); });

document.getElementById('restartBtn').addEventListener('click', ()=>{
  chosenDate=''; chosenActivity=''; dodge=0; yesScale=1;
  dateInput.value=''; continueBtn.disabled=true; lockBtn.disabled=true;
  activities.forEach(x=>x.classList.remove('selected'));
  yesBtn.style.fontSize=''; yesBtn.style.padding='';
  noBtn.style.position=''; noBtn.style.left=''; noBtn.style.top=''; noBtn.style.transform='';
  caption.textContent = captions[0];
  goTo(0);
});
</script>
</body>
</html>
